<script>
/* ============ УТИЛИТЫ ============ */
let blankCounter = 0;
const inputMap = {};

function b(ans, width = 64, tol = 0.001) {
  const id = `blank_${blankCounter++}`;
  return `<input class="blank" type="text" autocomplete="off" aria-label="Пропуск" id="${id}" data-answer="${ans}" data-tol="${tol}" style="width:${width}px">`;
}

function normalize(s) { return String(s).trim().replace(/\s+/g,"").replace(",","."); }
function parseNumber(raw) {
  let s = String(raw).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".");
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
  if (m) { const d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }
  return /^[+-]?\d+(?:\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}

function checkInput(inp) {
  if (String(inp.value).trim() === "") return false;
  const ans = parseNumber(inp.dataset.answer);
  const t = parseFloat(inp.dataset.tol);
  const tol = isNaN(t) ? 0.001 : t;
  const num = parseNumber(inp.value);
  if (!isNaN(ans)) return !isNaN(num) && Math.abs(num - ans) <= tol + 1e-9;
  return normalize(inp.value).toLowerCase() === normalize(inp.dataset.answer).toLowerCase();
}

function replaceInputsInMath(mathStr) {
  return mathStr.replace(/<input class="blank"[^>]*>/g, (match) => {
    const idMatch = match.match(/id="([^"]+)"/);
    if (idMatch) {
      const id = idMatch[1];
      inputMap[id] = match;
      return `\\htmlClass{${id}}{\\square}`;
    }
    return match;
  });
}

function prepareMath(html) {
  let processed = html.replace(/\\\((.*?)\\\)/gs, (match, inner) => {
    return '\\(' + replaceInputsInMath(inner) + '\\)';
  });
  processed = processed.replace(/\$\$(.*?)\$\$/gs, (match, inner) => {
    return '$$' + replaceInputsInMath(inner) + '$$';
  });
  return processed;
}

function restoreInputs(container) {
  if (!container) return;
  container.querySelectorAll('span[class*="blank_"]').forEach(span => {
    const className = Array.from(span.classList).find(c => c.startsWith('blank_'));
    if (className && inputMap[className]) {
      const tmp = document.createElement('div');
      tmp.innerHTML = inputMap[className];
      const input = tmp.firstElementChild;
      input.style.verticalAlign = 'middle';
      span.parentNode.replaceChild(input, span);
    }
  });
}

function renderMath(container = document.body) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\(", right: "\\)", display: false},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false,
      trust: true
    });
  }
}

/* ============ SVG ГЕНЕРАТОРЫ ============ */
function createEulerPointsSVG(aOnly, inBoth, bOnly, outside) {
  return `
  <div class="svg-container">
    <svg width="300" height="150" viewBox="0 0 300 150">
      <rect x="5" y="5" width="290" height="140" fill="#f4faf5" stroke="#a5d6a7" stroke-width="2" rx="8"/>
      <ellipse cx="110" cy="75" rx="65" ry="45" fill="#c8e6c9" fill-opacity="0.4" stroke="#2e7d32" stroke-width="2"/>
      <ellipse cx="190" cy="75" rx="65" ry="45" fill="#a5d6a7" fill-opacity="0.4" stroke="#1b5e20" stroke-width="2"/>
      <text x="55" y="78" font-size="18" font-weight="bold" fill="#2e7d32">A</text>
      <text x="240" y="78" font-size="18" font-weight="bold" fill="#1b5e20">B</text>
      ${aOnly} ${inBoth} ${bOnly} ${outside}
    </svg>
  </div>`;
}

function createEulerNumbersSVG(nOut, nA, nBoth, nB) {
  return `
  <div class="svg-container">
    <svg width="300" height="150" viewBox="0 0 300 150">
      <rect x="5" y="5" width="290" height="140" fill="#f4faf5" stroke="#a5d6a7" stroke-width="2" rx="8"/>
      <ellipse cx="110" cy="75" rx="65" ry="45" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
      <ellipse cx="190" cy="75" rx="65" ry="45" fill="#c8e6c9" fill-opacity="0.5" stroke="#1b5e20" stroke-width="2"/>
      <text x="35" y="30" font-size="16" font-weight="bold" fill="#1b5e20">${nOut}</text>
      <text x="90" y="80" font-size="18" font-weight="bold" fill="#2e7d32">${nA}</text>
      <text x="145" y="80" font-size="18" font-weight="bold" fill="#1b5e20">${nBoth}</text>
      <text x="205" y="80" font-size="18" font-weight="bold" fill="#1b5e20">${nB}</text>
      <text x="55" y="80" font-size="20" font-weight="bold" fill="#2e7d32">A</text>
      <text x="240" y="80" font-size="20" font-weight="bold" fill="#1b5e20">B</text>
    </svg>
  </div>`;
}

function createTreeSVG(pA, pNotA, pAB, pANotB, pNotAB, pNotANotB) {
  return `
  <div class="svg-container">
    <svg width="280" height="170" viewBox="0 0 280 170">
      <line x1="140" y1="20" x2="70" y2="70" stroke="#2e7d32" stroke-width="2"/>
      <line x1="140" y1="20" x2="210" y2="70" stroke="#2e7d32" stroke-width="2"/>
      <line x1="70" y1="70" x2="35" y2="135" stroke="#1b5e20" stroke-width="1.5"/>
      <line x1="70" y1="70" x2="105" y2="135" stroke="#1b5e20" stroke-width="1.5"/>
      <line x1="210" y1="70" x2="175" y2="135" stroke="#1b5e20" stroke-width="1.5"/>
      <line x1="210" y1="70" x2="245" y2="135" stroke="#1b5e20" stroke-width="1.5"/>

      <text x="135" y="15" font-size="15" font-weight="bold" fill="#2e7d32">S</text>
      <text x="63" y="65" font-size="15" font-weight="bold" fill="#2e7d32">A</text>
      <text x="203" y="65" font-size="15" font-weight="bold" fill="#2e7d32">Ā</text>
      <text x="28" y="152" font-size="15" font-weight="bold" fill="#1b5e20">B</text>
      <text x="98" y="152" font-size="15" font-weight="bold" fill="#1b5e20">B̄</text>
      <text x="168" y="152" font-size="15" font-weight="bold" fill="#1b5e20">B</text>
      <text x="238" y="152" font-size="15" font-weight="bold" fill="#1b5e20">B̄</text>

      <text x="85" y="40" font-size="12" font-weight="bold" fill="#1b5e20">${pA}</text>
      <text x="175" y="40" font-size="12" font-weight="bold" fill="#1b5e20">${pNotA}</text>
      <text x="38" y="100" font-size="11" font-weight="bold" fill="#2e7d32">${pAB}</text>
      <text x="92" y="100" font-size="11" font-weight="bold" fill="#2e7d32">${pANotB}</text>
      <text x="178" y="100" font-size="11" font-weight="bold" fill="#2e7d32">${pNotAB}</text>
      <text x="232" y="100" font-size="11" font-weight="bold" fill="#2e7d32">${pNotANotB}</text>
    </svg>
  </div>`;
}

/* ============ ДАННЫЕ ============ */
const groups = [

/* I) Статистическое определение вероятности */
{
  id: 1,
  section: "I. Статистическая вероятность",
  topic: "1. Монета (орёл и решка)",
  source: {
    condition: "Монету бросили 50 раз. Известно, что орёл выпал 31 раз. Найдите вероятность того, что при втором по счёту броске выпала решка.",
    idea: "<b>Главная мысль:</b> частота выпадения решки во всей серии испытаний равна статистической вероятности выпадения решки при любом броске.",
    steps: [
      "Число выпадений решки во всей серии: \\(50 - 31 = 19\\).",
      "Относительная частота (вероятность): \\(P = \\frac{19}{50} = 0{,}38\\).",
      "Ответ: 0,38."
    ]
  },
  practice: {
    condition: "Монету бросили 20 раз. Известно, что орёл выпал 12 раз. Найдите вероятность того, что при втором по счёту броске выпала решка.",
    answer: { val: 0.4, unit: "" },
    hints: ["Количество решек: \\(20 - 12 = 8\\).", "Разделите 8 на 20."],
    solution: { steps: [`Число решек: \\(20 - 12 = ${b(8,50)}\\).`, `Вероятность: \\(P = \\frac{8}{20} = ${b(0.4,60)}\\).`, "Ответ: 0,4."] }
  }
},
{
  id: 2,
  section: "I. Статистическая вероятность",
  topic: "2. Фонарики (исправность)",
  source: {
    condition: "В среднем из 120 карманных фонариков, поступивших в продажу, три неисправных. Найдите вероятность того, что выбранный наудачу в магазине фонарик окажется исправен.",
    idea: "<b>Главная мысль:</b> найдем отношение количества исправных фонариков к их общему числу.",
    steps: [
      "Количество исправных фонариков: \\(120 - 3 = 117\\).",
      "Вероятность: \\(P = \\frac{117}{120} = 0{,}975\\).",
      "Ответ: 0,975."
    ]

  practice: {
    condition: "В среднем из 150 карманных фонариков, поступивших в продажу, три неисправных. Найдите вероятность того, что выбранный наудачу в магазине фонарик окажется исправен.",
    answer: { val: 0.98, unit: "" },
    hints: ["Исправных: \\(150 - 3 = 147\\).", "Разделите 147 на 150."],
    solution: { steps: [`Исправных фонариков: \\(150 - 3 = ${b(147,60)}\\).`, `Вероятность: \\(P = \\frac{147}{150} = ${b(0.98,60)}\\).`, "Ответ: 0,98."] }

/* II) Классическое определение вероятности */

  topic: "3. Элементарные события N(A) и N",
  source: {
    condition: "В случайном опыте \\(N=30\\) равновозможных элементарных событий, из которых \\(N(A)=3\\) благоприятствуют событию A. Вычислите вероятность события A.",
    idea: "<b>Главная мысль:</b> классическая вероятность вычисляется по формуле \\(P(A) = \\frac{N(A)}{N}\\).",
    steps: [
      "\\(P(A) = \\frac{3}{30} = 0{,}1\\).",

    ]

  practice: {
    condition: "В случайном опыте \\(N=35\\) равновозможных элементарных событий, из которых \\(N(A)=21\\) благоприятствуют событию A. Вычислите вероятность события A.",
    answer: { val: 0.6, unit: "" },

    solution: { steps: [`\\(P(A) = \\frac{21}{35} = \\frac{3}{5} = ${b(0.6,60)}\\).`, "Ответ: 0,6."] }

{
  id: 4,
  section: "II. Классическая вероятность",
  topic: "4. Диаграмма Эйлера (Точки)",
  source: {
    condition: `На рисунке изображена диаграмма Эйлера для случайных событий A и B в некотором случайном опыте. Точками показаны все равновозможные элементарные события опыта:
    ${createEulerPointsSVG(
      '<circle cx="85" cy="60" r="4" fill="#1b5e20"/><circle cx="100" cy="95" r="4" fill="#1b5e20"/><circle cx="75" cy="85" r="4" fill="#1b5e20"/>',

    а) Найдите вероятность события A.<br>
    б) Найдите вероятность события B.<br>

    idea: "<b>Главная мысль:</b> посчитаем общее число точек \\(N=10\\) и делим количество точек нужной области на 10.",

    hints: ["Осталось зелёных: 15.", "Осталось всего: \\(10 + 15 = 25\\).", "Разделите 15 на 25."],
    solution: { steps: [`Зелёных осталось: \\(15\\). Всего осталось: \\(25\\).`, `\\(P = \\frac{15}{25} = ${b(0.6,60)}\\).`, "Ответ: 0,6."] }

},
{
  id: 18,
  section: "III. Формулы и Диаграммы",
  topic: "18. Дерево случайного опыта",
  source: {
    condition: `На рисунке изображено дерево случайного опыта:
    ${createTreeSVG("0,35", "0,65", "0,7", "0,3", "0,1", "0,9")}
    Найдите вероятность события B.`,

    Найдите вероятность события B.`,

    solution: { steps: [`Путь 1: \\(0{,}75 \\times 0{,}6 = ${b(0.45,60)}\\).`, `Путь 2: \\(0{,}25 \\times 0{,}2 = ${b(0.05,60)}\\).`, `\\(P(B) = 0{,}45 + 0{,}05 = ${b(0.5,60)}\\).`, "Ответ: 0,5."] }

/* ============ РЕНДЕР ИНТЕРФЕЙСА ============ */
const sections = [...new Set(groups.map(g => g.section))];
let currentSection = sections[0];
let currentGroupId = groups[0].id;

const sectionsEl = document.getElementById("sections");
const groupsEl = document.getElementById("groups");
const contentEl = document.getElementById("content");

function renderSectionTabs() {
  sectionsEl.innerHTML = "";
  sections.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "section-btn" + (s === currentSection ? " active" : "");
    btn.textContent = s;
    btn.setAttribute("aria-pressed", s === currentSection ? "true" : "false");
    btn.addEventListener("click", () => {
      currentSection = s;
      const firstInSection = groups.find(g => g.section === s);
      currentGroupId = firstInSection.id;
      renderSectionTabs();
      renderGroupTabs();
      renderContent();
    });
    sectionsEl.appendChild(btn);
  });
}

function renderGroupTabs() {
  groupsEl.innerHTML = "";
  groups.filter(g => g.section === currentSection).forEach(g => {
    const btn = document.createElement("button");
    btn.className = "group-btn" + (g.id === currentGroupId ? " active" : "");
    btn.innerHTML = prepareMath(`${g.topic}`);
    btn.setAttribute("aria-pressed", g.id === currentGroupId ? "true" : "false");
    btn.addEventListener("click", () => {
      currentGroupId = g.id;
      renderGroupTabs();
      renderContent();
    });
    groupsEl.appendChild(btn);
    renderMath(btn);
  });
}

function renderContent() {
  const g = groups.find(x => x.id === currentGroupId);
  const src = g.source;
  const pr = g.practice;

  const rawHTML = `
    <h2 class="topic">${g.topic}</h2>

    <div class="card card-source">
      <div class="card-label">📖 Пример решения</div>
      <div class="condition">${src.condition}</div>
      <div class="idea">${src.idea}</div>
      <div class="steps">
        ${src.steps.map((s,i) => `<div class="step"><span class="num">Шаг ${i+1}.</span>${s}</div>`).join("")}
      </div>
    </div>

    <div class="card card-practice" id="practiceCard">
      <div class="card-label">✏️ Реши самостоятельно</div>
      <div class="condition">${pr.condition}</div>
      <div class="answer-row">
        <label>Ответ: <input class="final" type="text" autocomplete="off" data-answer="${pr.answer.val}" data-tol="0.001"> ${pr.answer.unit}</label>
        <button class="check-answer">Проверить ответ</button>
        <span class="feedback" role="status" aria-live="polite"></span>
      </div>
      <div class="practice-actions">
        <button class="hint">💡 Подсказка</button>
        <button class="ghost reveal-btn">🔎 Показать решение (с пропусками)</button>
      </div>
      <div class="hints-wrap"></div>
      <div class="reveal hidden">
        <div class="steps">
          ${pr.solution.steps.map((s,i) => `<div class="step"><span class="num">Шаг ${i+1}.</span>${s}</div>`).join("")}
        </div>
        <div class="solution-controls">
          <button class="check-blanks">Проверить пропуски</button>
          <button class="ghost show-all">Показать все ответы</button>
          <span class="blanks-feedback" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  `;

  contentEl.innerHTML = prepareMath(rawHTML);
  renderMath(contentEl);
  restoreInputs(contentEl);

  const card = document.getElementById("practiceCard");
  const input = card.querySelector(".final");
  const feedback = card.querySelector(".feedback");
  const hintsWrap = card.querySelector(".hints-wrap");
  const hintBtn = card.querySelector(".hint");
  const revealBtn = card.querySelector(".reveal-btn");
  const reveal = card.querySelector(".reveal");
  const blanksFb = card.querySelector(".blanks-feedback");
  let hintIndex = 0;
  input.addEventListener("keydown", e => { if (e.key === "Enter") card.querySelector(".check-answer").click(); });

  card.querySelector(".check-answer").addEventListener("click", () => {
    const ok = checkInput(input);
    input.classList.toggle("ok", ok);
    input.classList.toggle("err", !ok);
    feedback.textContent = ok ? "Верно! Отличная работа." : "Пока неверно — попробуй ещё раз или открой решение.";
    feedback.className = "feedback " + (ok ? "ok" : "err");
    if (ok) card.classList.add("practice-solved");
  });

  hintBtn.addEventListener("click", () => {
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны"; return;
    }
    const box = document.createElement("div");
    box.className = "hint-box";
    box.innerHTML = prepareMath(`<b>Подсказка ${hintIndex+1}.</b> ${pr.hints[hintIndex]}`);
    hintsWrap.appendChild(box);
    renderMath(box);
    restoreInputs(box);
    hintIndex++;
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны";
    }
  });

  revealBtn.addEventListener("click", () => {
    reveal.classList.toggle("hidden");
    revealBtn.textContent = reveal.classList.contains("hidden")
      ? "🔎 Показать решение (с пропусками)"
      : "Скрыть решение";
    if (!reveal.classList.contains("hidden")) {
      renderMath(reveal);
      restoreInputs(reveal);
    }
  });

  card.querySelector(".check-blanks").addEventListener("click", () => {
    const blanks = reveal.querySelectorAll("input.blank");
    let okCount = 0;
    blanks.forEach(inp => {
      const ok = checkInput(inp);
      inp.classList.remove("shown");
      inp.classList.toggle("ok", ok);
      inp.classList.toggle("err", !ok && inp.value.trim() !== "");
      if (ok) okCount++;
    });
    blanksFb.textContent = `Верно: ${okCount} из ${blanks.length}`;
    blanksFb.className = "blanks-feedback " + (okCount === blanks.length ? "ok" : "err");
  });

  card.querySelector(".show-all").addEventListener("click", () => {
    reveal.querySelectorAll("input.blank").forEach(inp => {
      inp.value = String(inp.dataset.answer).replace(".", ",");
      inp.classList.remove("err", "ok");
      inp.classList.add("shown");
    });
    blanksFb.textContent = "Все пропуски заполнены.";
    blanksFb.className = "blanks-feedback ok";
  });
}

renderSectionTabs();
renderGroupTabs();
renderContent();
</script>
</body>
</html>
