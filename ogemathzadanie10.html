    --green-2:#c8e6c9;
    --green-3:#a5d6a7;
    --green-4:#f4faf5;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    font-size:15px;
  }
  header{
    background:linear-gradient(135deg,#2e7d32,#1b5e20);
    color:#fff;
    padding:22px 16px 18px;
    text-align:center;

  header h1{margin:0 0 4px; font-size:clamp(18px,2.5vw,24px)}
  header p{margin:0; font-size:14px}

  .nav{
    background:#fff;
    border-bottom:1px solid var(--green-3);
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 10px rgba(46,125,50,.08);
  }
  .sections{

    padding:8px 14px;

    font-size:13.5px;

    color:var(--accent-dark);

  .section-btn.active{background:var(--accent); color:#fff}

  .groups{

<script>
/* ============ УТИЛИТЫ ============ */
function normalize(s) { return String(s).trim().replace(/\s+/g,"").replace(",","."); }
function parseNumber(raw) {
  let s = String(raw).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".");
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
  if (m) { const d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }
  return /^[+-]?\d+(?:\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}

function checkInput(inp) {
  if (String(inp.value).trim() === "") return false;
  const ans = parseNumber(inp.dataset.answer);
  const tol = 0.001;
  const num = parseNumber(inp.value);
  if (!isNaN(ans)) return !isNaN(num) && Math.abs(num - ans) <= tol + 1e-9;
  return normalize(inp.value).toLowerCase() === normalize(inp.dataset.answer).toLowerCase();
}

function renderMath(container = document.body) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\(", right: "\\)", display: false},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false,
      trust: true
    });
  }
}

function miniEuler(regions, label, uid) {
  const hl = '#66bb6a';
  const W = 110, H = 78;
  const cA = {cx: 44, cy: 39, r: 22};
  const cB = {cx: 66, cy: 39, r: 22};

  let layers = '';
  if (regions.outside) {
    layers += `<rect x="2" y="2" width="${W-4}" height="${H-4}" fill="${hl}" mask="url(#mNotAB_${uid})" rx="5"/>`;
  }
  if (regions.onlyA) {
    layers += `<circle cx="${cA.cx}" cy="${cA.cy}" r="${cA.r}" fill="${hl}" mask="url(#mNotB_${uid})"/>`;
  }
  if (regions.both) {
    layers += `<circle cx="${cA.cx}" cy="${cA.cy}" r="${cA.r}" fill="${hl}" clip-path="url(#cpB_${uid})"/>`;
  }
  if (regions.onlyB) {
    layers += `<circle cx="${cB.cx}" cy="${cB.cy}" r="${cB.r}" fill="${hl}" mask="url(#mNotA_${uid})"/>`;
  }

  return `
    <div class="legend-item">
      <svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
        <defs>
          <clipPath id="cpB_${uid}"><circle cx="${cB.cx}" cy="${cB.cy}" r="${cB.r}"/></clipPath>
          <mask id="mNotA_${uid}"><rect width="${W}" height="${H}" fill="white"/><circle cx="${cA.cx}" cy="${cA.cy}" r="${cA.r}" fill="black"/></mask>
          <mask id="mNotB_${uid}"><rect width="${W}" height="${H}" fill="white"/><circle cx="${cB.cx}" cy="${cB.cy}" r="${cB.r}" fill="black"/></mask>
          <mask id="mNotAB_${uid}"><rect width="${W}" height="${H}" fill="white"/><circle cx="${cA.cx}" cy="${cA.cy}" r="${cA.r}" fill="black"/><circle cx="${cB.cx}" cy="${cB.cy}" r="${cB.r}" fill="black"/></mask>
        </defs>
        <rect x="2" y="2" width="${W-4}" height="${H-4}" fill="#f4faf5" stroke="#a5d6a7" stroke-width="1.5" rx="5"/>
        ${layers}
        <circle cx="${cA.cx}" cy="${cA.cy}" r="${cA.r}" fill="none" stroke="#2e7d32" stroke-width="1.8"/>
        <circle cx="${cB.cx}" cy="${cB.cy}" r="${cB.r}" fill="none" stroke="#1b5e20" stroke-width="1.8"/>
        <text x="${cA.cx - cA.r + 3}" y="${cA.cy + 4}" font-size="11" font-weight="bold" fill="#2e7d32">A</text>
        <text x="${cB.cx + cB.r - 11}" y="${cB.cy + 4}" font-size="11" font-weight="bold" fill="#1b5e20">B</text>
      </svg>
      <div class="legend-label">\\(${label}\\)</div>
    </div>
  `;
}

function createEulerLegend() {
  const base = 'leg' + Math.random().toString(36).substr(2, 8);
  const items = [
    { regions: {onlyA:true, both:true}, label: 'A' },
    { regions: {onlyB:true, both:true}, label: 'B' },
    { regions: {both:true}, label: 'A \\cap B' },
    { regions: {onlyA:true, both:true, onlyB:true}, label: 'A \\cup B' },
    { regions: {onlyB:true, outside:true}, label: '\\overline{A}' },
    { regions: {onlyA:true, outside:true}, label: '\\overline{B}' },
    { regions: {onlyB:true}, label: '\\overline{A} \\cap B' },
    { regions: {onlyA:true}, label: 'A \\cap \\overline{B}' },
    { regions: {both:true, onlyB:true, outside:true}, label: '\\overline{A} \\cup B' },
    { regions: {onlyA:true, both:true, outside:true}, label: 'A \\cup \\overline{B}' },
    { regions: {onlyA:true, onlyB:true, outside:true}, label: '\\overline{A \\cap B}' },
    { regions: {outside:true}, label: '\\overline{A \\cup B}' }
  ];
  const svgs = items.map((it, i) => miniEuler(it.regions, it.label, `${base}_${i}`)).join('');

  return `
    <div class="euler-legend">
      <div class="legend-title">📊 Шпаргалка: как читать диаграмму Эйлера</div>
      <div class="legend-grid">${svgs}</div>
      <div class="legend-note">
        <b>Зелёным</b> выделена область, соответствующая событию (её вероятность).
      </div>
    </div>
  `;
}

/* ============ РЕНДЕР ИНТЕРФЕЙСА ============ */
const sections = [...new Set(groups.map(g => g.section))];
let currentSection = sections[0];
let currentGroupId = groups[0].id;

const sectionsEl = document.getElementById("sections");
const groupsEl = document.getElementById("groups");
const contentEl = document.getElementById("content");

function renderSectionTabs() {
  sectionsEl.innerHTML = "";
  sections.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "section-btn" + (s === currentSection ? " active" : "");
    btn.textContent = s;
    btn.setAttribute("aria-pressed", s === currentSection ? "true" : "false");
    btn.addEventListener("click", () => {
      currentSection = s;
      const firstInSection = groups.find(g => g.section === s);
      currentGroupId = firstInSection.id;
      renderSectionTabs();
      renderGroupTabs();
      renderContent();
    });
    sectionsEl.appendChild(btn);
  });
}

function renderGroupTabs() {
  groupsEl.innerHTML = "";
  groups.filter(g => g.section === currentSection).forEach(g => {
    const btn = document.createElement("button");
    btn.className = "group-btn" + (g.id === currentGroupId ? " active" : "");
    btn.innerHTML = g.topic;
    btn.setAttribute("aria-pressed", g.id === currentGroupId ? "true" : "false");
    btn.addEventListener("click", () => {
      currentGroupId = g.id;
      renderGroupTabs();
      renderContent();
    });
    groupsEl.appendChild(btn);
    renderMath(btn);
  });
}

function renderContent() {
  const g = groups.find(x => x.id === currentGroupId);
  const src = g.source;
  const pr = g.practice;

  // HTML для ответа источника
  let srcAnswerHTML = '';
  if (src.answer) {
    const ans = Array.isArray(src.answer)
      ? `<br>${src.answer.join('<br>')}`
      : ` ${src.answer}`;
    srcAnswerHTML = `<div class="answer-final"><b>Ответ:</b>${ans}</div>`;
  }

  // HTML для полей ввода практики
  let practiceInputsHTML = '';
  if (pr.answers) {
    practiceInputsHTML = `
      <div class="practice-inputs">
        ${pr.answers.map((ansObj, idx) => `
          <div class="practice-input-item">
            <span>${ansObj.label}</span>
            <input class="final" type="text" autocomplete="off" data-answer="${ansObj.val}" aria-label="Ответ ${ansObj.label}">
          </div>
        `).join('')}
      </div>
    `;
  } else {
    practiceInputsHTML = `
      <div class="answer-row">
        <label>Ответ: <input class="final" type="text" autocomplete="off" data-answer="${pr.answer.val}"> ${pr.answer.unit}</label>
      </div>
    `;
  }

  const rawHTML = `
    <h2 class="topic">${g.topic}</h2>

    <div class="card card-source">
      <div class="card-label">📖 Пример решения</div>
      <div class="condition">${src.condition}</div>
      ${src.extraVisual || ''}
      <div class="idea">${src.idea}</div>
      <div class="steps">
        ${src.steps.map((s,i) => `<div class="step"><span class="num">Шаг ${i+1}.</span>${s}</div>`).join("")}
      </div>
      ${srcAnswerHTML}
    </div>

    <div class="card card-practice" id="practiceCard">
      <div class="card-label">✏️ Реши самостоятельно</div>
      <div class="condition">${pr.condition}</div>
      
      ${practiceInputsHTML}
      
      <div class="answer-row" style="background:transparent; border:none; padding:0; margin-top:10px;">
        <button class="check-answer">Проверить ответ</button>
        <button class="hint">💡 Подсказка</button>
        <span class="feedback" role="status" aria-live="polite"></span>
      </div>
      <div class="hints-wrap"></div>
    </div>
  `;

  contentEl.innerHTML = rawHTML;
  renderMath(contentEl);

  const card = document.getElementById("practiceCard");
  const inputs = Array.from(card.querySelectorAll("input.final"));
  const feedback = card.querySelector(".feedback");
  const hintsWrap = card.querySelector(".hints-wrap");
  const hintBtn = card.querySelector(".hint");
  const checkBtn = card.querySelector(".check-answer");
  
  let hintIndex = 0;

  // Добавляем Enter на инпуты
  inputs.forEach(inp => {
    inp.addEventListener("keydown", e => { if (e.key === "Enter") checkBtn.click(); });
  });

  checkBtn.addEventListener("click", () => {
    let correctCount = 0;
    inputs.forEach(inp => {
      const ok = checkInput(inp);
      inp.classList.toggle("ok", ok);
      inp.classList.toggle("err", !ok && inp.value.trim() !== "");
      if (ok) correctCount++;
    });

    const total = inputs.length;
    if (correctCount === total) {
      feedback.textContent = "Верно! Отличная работа.";
      feedback.className = "feedback ok";
      card.classList.add("practice-solved");
    } else {
      feedback.textContent = `Верно: ${correctCount} из ${total}. Попробуй ещё раз или открой подсказку.`;
      feedback.className = "feedback err";
    }
  });

  hintBtn.addEventListener("click", () => {
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны"; return;
    }
    const box = document.createElement("div");
    box.className = "hint-box";
    box.innerHTML = `<b>Подсказка ${hintIndex+1}.</b> ${pr.hints[hintIndex]}`;
    hintsWrap.appendChild(box);
    renderMath(box);
    hintIndex++;
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны";
    }
  });
}

// Ждем полной загрузки страницы и всех скриптов (включая KaTeX)
window.addEventListener('load', () => {
  renderSectionTabs();
  renderGroupTabs();
  renderContent();
});
</script>
