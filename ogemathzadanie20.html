<style>
  :root{
    --bg:#fdf2f7;
    --card:#ffffff;
    --accent:#d81b60;
    --accent-dark:#ad1457;
    --ok:#1d7a4d;
    --err:#d02a4c;
    --text:#2b2028;
    --muted:#7a6670;
    --gold:#f48fb1;
    --rose-1:#fce4ec;
    --rose-2:#f8d7e3;
    --rose-3:#f3c9da;
    --rose-4:#fffafc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.55;
    font-size:15px;
  }
  header{
    background:linear-gradient(135deg,#d81b60,#ad1457);
    color:#fff;
    padding:22px 16px 18px;
    text-align:center;
  }
  header h1{margin:0 0 4px; font-size:clamp(18px,2.5vw,24px)}
  header p{margin:0; font-size:14px}

  .nav{
    background:#fff;
    border-bottom:1px solid var(--rose-3);
    position:sticky;
    top:0;
    z-index:10;
    box-shadow:0 2px 10px rgba(216,27,96,.08);
  }
  .sections{
    display:flex;
    gap:6px;
    padding:10px 12px;
    overflow-x:auto;
    white-space:nowrap;
    border-bottom:1px solid var(--rose-2);
  }
  .sections::-webkit-scrollbar{height:6px}
  .sections::-webkit-scrollbar-thumb{background:var(--rose-3); border-radius:3px}
  .section-btn{
    background:var(--rose-1);
    border:none;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    font-family:inherit;
    font-size:13.5px;
    font-weight:700;
    color:var(--accent-dark);
    white-space:nowrap;
    transition:.15s;
  }
  .section-btn:hover{background:var(--rose-2)}
  .section-btn.active{background:var(--accent); color:#fff}

  .groups{
    display:flex;
    gap:6px;
    padding:8px 12px;
    overflow-x:auto;
    white-space:nowrap;
  }
  .groups::-webkit-scrollbar{height:6px}
  .groups::-webkit-scrollbar-thumb{background:var(--rose-3); border-radius:3px}
  .group-btn{
    background:#fff;
    border:2px solid var(--rose-3);
    padding:6px 12px;
    border-radius:8px;
    cursor:pointer;
    font-family:inherit;
    font-size:13px;
    font-weight:600;
    color:var(--muted);
    white-space:nowrap;
    transition:.15s;
  }
  .group-btn:hover{border-color:var(--accent); color:var(--accent-dark)}
  .group-btn.active{
    background:var(--rose-1);
    border-color:var(--accent);
    color:var(--accent-dark);
  }

  main{max-width:900px; margin:0 auto; padding:20px 14px 60px}

  .card{
    background:var(--card);
    border-radius:14px;
    padding:18px;
    margin-bottom:14px;
    box-shadow:0 4px 18px rgba(216,27,96,.07);

  .card-label{
    display:inline-flex;
    align-items:center;
    gap:6px;
    font-size:12px;
    font-weight:800;
    padding:3px 10px;

    margin-bottom:10px;

  .card-practice .card-label{background:#fde7f0; color:#b0306e}

  .topic{

    font-weight:800;
    color:var(--accent-dark);
    margin-bottom:10px;
  }
  .condition{font-size:14.5px; margin:0 0 12px}

    background:#fff5f9;
    border-left:4px solid var(--gold);
    border-radius:6px;
    padding:10px 12px;
    margin-bottom:12px;
    font-size:13.5px;
  }
  .idea b{color:#b0306e}

  .table-wrap{overflow-x:auto; margin-bottom:12px}
  table.cond{
    border-collapse:collapse;
    width:100%;
    font-size:13.5px;
    background:#fff;
  }
  table.cond caption{
    caption-side:top;
    text-align:left;
    font-weight:700;
    color:var(--accent-dark);
    padding-bottom:5px;
    font-size:13px;
  }

  table.cond th{

    color:var(--accent-dark);

  }
  table.cond td.left{

    background:var(--rose-4);
  }

  .steps{display:flex; flex-direction:column; gap:8px}
  .step{

    padding:9px 12px;

  .step .num{

    color:var(--accent-dark);
    margin-right:5px;
  }
  .check-line{

    font-size:13.5px;
    margin-top:10px;
    color:#0e6b3c;

  .answer-row{
    display:flex;
    flex-wrap:wrap;
    align-items:center;
    gap:10px;
    padding:10px 12px;

    border-radius:10px;
    border:1px dashed var(--rose-3);

  .answer-row label{font-weight:600; font-size:14px}

  input[type="text"]{
    border:2px solid var(--rose-3);
    border-radius:6px;
    padding:5px 8px;
    font-size:14px;
    font-family:inherit;
    transition:.15s;
    background:#fff;

  input.final{width:100px}
  input.blank{width:64px; text-align:center; font-weight:700; font-size:13.5px; vertical-align: middle;}
  input:focus{
    outline:none;
    border-color:var(--accent);
    box-shadow:0 0 0 3px rgba(216,27,96,.15);
  }
  input.ok{border-color:var(--ok); background:#eefaf2}
  input.err{border-color:var(--err); background:#fdeeee}
  input.shown{border-color:var(--accent); background:var(--rose-1)}

  button{
    border:none;
    border-radius:8px;
    padding:8px 14px;
    font-size:13.5px;
    font-weight:600;
    font-family:inherit;
    cursor:pointer;
    transition:.15s;
    background:var(--accent);
    color:#fff;
  }
  button:hover{background:var(--accent-dark); transform:translateY(-1px)}
  button.ghost{background:var(--rose-1); color:var(--accent-dark)}
  button.ghost:hover{background:var(--rose-2)}
  button.hint{background:#fde7f0; color:#b0306e}
  button.hint:hover{background:#fbd3e3}
  button:disabled{opacity:.5; cursor:default; transform:none}

  .feedback{font-weight:700; font-size:14px}
  .feedback.ok{color:var(--ok)}
  .feedback.err{color:var(--err)}

  .hint-box{
    background:#fff5f9;
    border-left:4px solid var(--gold);
    border-radius:6px;
    padding:9px 12px;
    margin-top:8px;
    font-size:13.5px;
  }
  .hint-box b{color:#b0306e}

  .reveal{margin-top:12px; padding-top:12px; border-top:1px solid var(--rose-2)}
  .solution-controls{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    align-items:center;
    margin-top:12px;
  }
  .blanks-feedback{font-weight:700; font-size:13.5px}
  .blanks-feedback.ok{color:var(--ok)}
  .blanks-feedback.err{color:var(--err)}

  .hidden{display:none}
  .practice-actions{display:flex; gap:8px; flex-wrap:wrap}
  h2.topic{margin:0 0 10px}
  button:focus-visible,input:focus-visible{outline:3px solid #1b3a8a; outline-offset:2px}
  @media (max-width:600px){ input[type="text"]{font-size:16px} }
</style>

<script>
/* ============ утилиты ============ */
let blankCounter = 0;
const inputMap = {};

function b(ans, width = 64, tol = 0.01) {
  const id = `blank_${blankCounter++}`;
  return `<input class="blank" type="text" autocomplete="off" aria-label="Пропуск в решении" id="${id}" data-answer="${ans}" data-tol="${tol}" style="width:${width}px">`;
}

function normalize(s) { return String(s).trim().replace(/\s+/g,"").replace(",","."); }
const UNITS = /(км\/ч|м\/с|л\/мин|дет\.?\/ч|км|кг|мин|дет\.?|м|л|ч|с)\.?$/i;
function parseNumber(raw) {
  let s = String(raw).trim().replace(/\s+/g, "").replace(/[−–—]/g, "-").replace(/,/g, ".");
  s = s.replace(/^[xXхХyYуУ]=/, "").replace(UNITS, "");
  const m = s.match(/^([+-]?\d+(?:\.\d+)?)\/([+-]?\d+(?:\.\d+)?)$/);
  if (m) { const d = parseFloat(m[2]); return d === 0 ? NaN : parseFloat(m[1]) / d; }
  return /^[+-]?\d+(?:\.\d+)?$/.test(s) ? parseFloat(s) : NaN;
}

function checkInput(inp) {
  if (String(inp.value).trim() === "") return false;
  const ans = parseNumber(inp.dataset.answer);
  const t = parseFloat(inp.dataset.tol);
  const tol = isNaN(t) ? 0.01 : t;
  const num = parseNumber(inp.value);
  if (!isNaN(ans)) return !isNaN(num) && Math.abs(num - ans) <= tol + 1e-9;
  return normalize(inp.value).toLowerCase() === normalize(inp.dataset.answer).toLowerCase();
}

function replaceInputsInMath(mathStr) {
  return mathStr.replace(/<input class="blank"[^>]*>/g, (match) => {
    const idMatch = match.match(/id="([^"]+)"/);
    if (idMatch) {
      const id = idMatch[1];
      inputMap[id] = match;
      return `\\htmlClass{${id}}{\\square}`;
    }
    return match;
  });
}

function prepareMath(html) {
  let processed = html.replace(/\\\((.*?)\\\)/gs, (match, inner) => {
    return '\\(' + replaceInputsInMath(inner) + '\\)';
  });
  processed = processed.replace(/\$\$(.*?)\$\$/gs, (match, inner) => {
    return '$$' + replaceInputsInMath(inner) + '$$';
  });
  return processed;
}

function restoreInputs(container) {
  if (!container) return;
  container.querySelectorAll('span[class*="blank_"]').forEach(span => {
    const className = Array.from(span.classList).find(c => c.startsWith('blank_'));
    if (className && inputMap[className]) {
      const tmp = document.createElement('div');
      tmp.innerHTML = inputMap[className];
      const input = tmp.firstElementChild;
      input.style.verticalAlign = 'middle';
      span.parentNode.replaceChild(input, span);
    }
  });
}

function renderMath(container = document.body) {
  if (typeof renderMathInElement === 'function') {
    renderMathInElement(container, {
      delimiters: [
        {left: "$$", right: "$$", display: true},
        {left: "\\(", right: "\\)", display: false},
        {left: "$", right: "$", display: false}
      ],
      throwOnError: false,
      trust: true
    });
  }
}

/* ============ данные ============ */
const groups = [

/* ============================================================
   РАЗДЕЛ: ВЫРАЖЕНИЯ
   ============================================================ */
{
  id: 1,
  section: "Выражения",
  topic: "Нахождение значения выражения",
  source: {
    condition: "Найдите значение выражения \\(28a - 7b + 13\\), если \\(\\frac{2a - 5b + 8}{5a - 2b + 8} = 6\\).",
    idea: "<b>Главная мысль:</b> из заданного дробного равенства нужно выразить комбинацию \\(28a - 7b\\).",
    steps: [
      "Умножим обе части на знаменатель: \\(2a - 5b + 8 = 6(5a - 2b + 8)\\).",
      "Раскроем скобки: \\(2a - 5b + 8 = 30a - 12b + 48\\).",
      "Перенесём слагаемые с \\(a\\) и \\(b\\) влево, а числа вправо: \\(2a - 30a - 5b + 12b = 48 - 8\\).",
      "\\(-28a + 7b = 40\\). Умножим на \\(-1\\): \\(28a - 7b = -40\\).",
      "Подставим в искомое выражение: \\(-40 + 13 = -27\\).",
      "Ответ: -27."
    ]
  },
  practice: {
    condition: "Найдите значение выражения \\(31a - 4b + 55\\), если \\(\\frac{a - 4b + 7}{4a - b + 7} = 8\\).",
    answer: { val: 6, unit: "" },
    hints: [
      "Умножьте обе части на знаменатель: \\(a - 4b + 7 = 8(4a - b + 7)\\).",
      "Раскройте скобки и выразите \\(31a - 4b\\)."
    ],
    solution: {
      steps: [
        `\\(a - 4b + 7 = 8(4a - b + 7)\\)`,
        `\\(a - 4b + 7 = 32a - 8b + 56\\)`,
        `\\(a - 32a - 4b + 8b = 56 - 7\\)`,
        `\\(-31a + 4b = ${b(49,70)}\\)`,
        `Умножим на \\(-1\\): \\(31a - 4b = ${b(-49,70)}\\)`,
        `Тогда \\(31a - 4b + 55 = -49 + 55 = ${b(6,70)}\\).`
      ]
    }
  }
},

/* ============================================================
   РАЗДЕЛ: УРАВНЕНИЯ
   ============================================================ */
{
  id: 2,
  section: "Уравнения",
  topic: "Кубические уравнения (группировка)",
  source: {
    condition: "Решите уравнение: \\(x^3 + 5x^2 - 16x - 80 = 0\\).",
    idea: "<b>Главная мысль:</b> сгруппируем слагаемые попарно и вынесем общий множитель.",
    steps: [
      "Группируем: \\((x^3 + 5x^2) - (16x + 80) = 0\\).",
      "Выносим общий множитель: \\(x^2(x + 5) - 16(x + 5) = 0\\).",
      "Получаем: \\((x^2 - 16)(x + 5) = 0\\).",
      "Разность квадратов: \\((x - 4)(x + 4)(x + 5) = 0\\).",
      "Корни: \\(x = 4\\), \\(x = -4\\), \\(x = -5\\).",
      "Ответ: -5; -4; 4."
    ]
  },
  practice: {
    condition: "Решите уравнение: \\(x^3 + 2x^2 - x - 2 = 0\\).",
    answer: { val: "-2;-1;1", unit: "" },
    hints: [
      "Сгруппируйте первое со вторым, а третье с четвёртым слагаемым.",
      "Вынесите \\(x^2\\) из первой скобки и \\(-1\\) из второй."
    ],
    solution: {
      steps: [
        `\\((x^3 + 2x^2) - (x + 2) = 0\\)`,
        `\\(x^2(x + 2) - 1(x + 2) = 0\\)`,
        `\\((x^2 - 1)(x + 2) = 0\\)`,
        `\\((x - 1)(x + 1)(x + 2) = 0\\)`,
        `\\(x_1 = ${b(1,50)}\\), \\(x_2 = ${b(-1,50)}\\), \\(x_3 = ${b(-2,50)}\\).`
      ]
    }
  }
},
{
  id: 3,
  section: "Уравнения",
  topic: "Уравнения с квадратным корнем",
  source: {
    condition: "Решите уравнение: \\(x^2 - 2x + \\sqrt{7 - x} = \\sqrt{7 - x} + 48\\).",
    idea: "<b>Главная мысль:</b> корни взаимно уничтожаются, но нужно учесть ОДЗ подкоренного выражения.",
    steps: [
      "ОДЗ: подкоренное выражение неотрицательно: \\(7 - x \\ge 0 \\Rightarrow x \\le 7\\).",
      "Уничтожаем \\(\\sqrt{7 - x}\\) с обеих сторон: \\(x^2 - 2x = 48\\).",
      "Переносим всё влево: \\(x^2 - 2x - 48 = 0\\).",
      "По теореме Виета корни: \\(x_1 = 8\\), \\(x_2 = -6\\).",
      "Корень \\(x = 8\\) не подходит, так как \\(8 > 7\\). Остаётся \\(x = -6\\).",
      "Ответ: -6."
    ]
  },
  practice: {
    condition: "Решите уравнение: \\(x^2 - 2x + \\sqrt{4 - x} = \\sqrt{4 - x} + 15\\).",
    answer: { val: -3, unit: "" },
    hints: [
      "Не забудьте проверить ОДЗ: \\(4 - x \\ge 0\\).",
      "Уничтожьте корни. Получится квадратное уравнение."
    ],
    solution: {
      steps: [
        `ОДЗ: подкоренное выражение неотрицательно: \\(4 - x \\ge 0 \\Rightarrow x \\le 4\\).`,
        `Убираем корни: \\(x^2 - 2x = ${b(15,70)}\\).`,
        `\\(x^2 - 2x - 15 = 0\\).`,
        `Корни: \\(x = ${b(5,50)}\\) и \\(x = ${b(-3,50)}\\).`,
        `Корень \\(5\\) не подходит, так как \\(5 > 4\\).`
      ]
    }
  }
},
{
  id: 4,
  section: "Уравнения",
  topic: "Разложение на множители (с квадратом двучлена)",
  source: {
    condition: "Решите уравнение: \\(x(x^2 + 10x + 25) = 14(x + 5)\\).",
    idea: "<b>Главная мысль:</b> свёртываем квадрат двучлена и выносим общий множитель.",
    steps: [
      "Замечаем, что \\(x^2 + 10x + 25 = (x + 5)^2\\).",
      "Перепишем: \\(x(x + 5)^2 - 14(x + 5) = 0\\).",
      "Вынесем \\((x + 5)\\): \\((x + 5)(x(x + 5) - 14) = 0\\).",
      "Упрощаем вторую скобку: \\((x + 5)(x^2 + 5x - 14) = 0\\).",
      "Раскладываем трёхчлен: \\((x + 5)(x + 7)(x - 2) = 0\\).",
      "Ответ: -7; -5; 2."
    ]
  },
  practice: {
    condition: "Решите уравнение: \\((x - 1)(x^2 + 8x + 16) = 6(x + 4)\\).",

    solution: {

{

  },
  practice: {

    hints: [
      "Решите два уравнения отдельно: \\(x^2 - 4 = 0\\) и \\(x^2 - 3x - 10 = 0\\).",

},
{

/* ============ рендер ============ */
const sections = [...new Set(groups.map(g => g.section))];
let currentSection = sections[0];
let currentGroupId = groups[0].id;

const sectionsEl = document.getElementById("sections");
const groupsEl = document.getElementById("groups");
const contentEl = document.getElementById("content");

function renderSectionTabs() {
  sectionsEl.innerHTML = "";
  sections.forEach(s => {
    const btn = document.createElement("button");
    btn.className = "section-btn" + (s === currentSection ? " active" : "");
    btn.textContent = s;
    btn.setAttribute("aria-pressed", s === currentSection ? "true" : "false");
    btn.addEventListener("click", () => {
      currentSection = s;
      const firstInSection = groups.find(g => g.section === s);
      currentGroupId = firstInSection.id;
      renderSectionTabs();
      renderGroupTabs();
      renderContent();
    });
    sectionsEl.appendChild(btn);
  });
}

function renderGroupTabs() {
  groupsEl.innerHTML = "";
  groups.filter(g => g.section === currentSection).forEach(g => {
    const btn = document.createElement("button");
    btn.className = "group-btn" + (g.id === currentGroupId ? " active" : "");
    btn.innerHTML = prepareMath(`${g.id}. ${g.topic}`);
    btn.setAttribute("aria-pressed", g.id === currentGroupId ? "true" : "false");
    btn.addEventListener("click", () => {
      currentGroupId = g.id;
      renderGroupTabs();
      renderContent();
    });
    groupsEl.appendChild(btn);
    renderMath(btn);
  });
}

function renderContent() {
  const g = groups.find(x => x.id === currentGroupId);
  const src = g.source;
  const pr = g.practice;

  const rawHTML = `
    <h2 class="topic">${g.id}. ${g.topic}</h2>

    <div class="card card-source">
      <div class="card-label">📖 Разбираем вместе</div>
      <p class="condition">${src.condition}</p>
      <div class="idea">${src.idea}</div>
      <div class="steps">
        ${src.steps.map((s,i) => `<div class="step"><span class="num">Шаг ${i+1}.</span>${s}</div>`).join("")}
      </div>
      ${src.check ? `<div class="check-line">✓ ${src.check}</div>` : ""}
    </div>

    <div class="card card-practice" id="practiceCard">
      <div class="card-label">✏️ Реши сам</div>
      <p class="condition">${pr.condition}</p>
      <div class="answer-row">
        <label>Ответ: <input class="final" type="text" autocomplete="off" data-answer="${pr.answer.val}" data-tol="0.01"> ${pr.answer.unit}</label>
        <button class="check-answer">Проверить ответ</button>
        <span class="feedback" role="status" aria-live="polite"></span>
      </div>
      <div class="practice-actions">
        <button class="hint">💡 Подсказка</button>
        <button class="ghost reveal-btn">🔎 Показать решение (заполни пропуски)</button>
      </div>
      <div class="hints-wrap"></div>
      <div class="reveal hidden">
        <div class="steps">
          ${pr.solution.steps.map((s,i) => `<div class="step"><span class="num">Шаг ${i+1}.</span>${s}</div>`).join("")}
        </div>
        <div class="solution-controls">
          <button class="check-blanks">Проверить пропуски</button>
          <button class="ghost show-all">Показать все ответы</button>
          <span class="blanks-feedback" role="status" aria-live="polite"></span>
        </div>
      </div>
    </div>
  `;

  contentEl.innerHTML = prepareMath(rawHTML);
  renderMath(contentEl);
  restoreInputs(contentEl);

  const card = document.getElementById("practiceCard");
  const input = card.querySelector(".final");
  const feedback = card.querySelector(".feedback");
  const hintsWrap = card.querySelector(".hints-wrap");
  const hintBtn = card.querySelector(".hint");
  const revealBtn = card.querySelector(".reveal-btn");
  const reveal = card.querySelector(".reveal");
  const blanksFb = card.querySelector(".blanks-feedback");
  let hintIndex = 0;
  input.addEventListener("keydown", e => { if (e.key === "Enter") card.querySelector(".check-answer").click(); });

  card.querySelector(".check-answer").addEventListener("click", () => {
    const ok = checkInput(input);
    input.classList.toggle("ok", ok);
    input.classList.toggle("err", !ok);
    feedback.textContent = ok ? "Верно! Молодец." : "Пока неверно — попробуй ещё или открой решение.";
    feedback.className = "feedback " + (ok ? "ok" : "err");
    if (ok) card.classList.add("practice-solved");
  });

  hintBtn.addEventListener("click", () => {
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны"; return;
    }
    const box = document.createElement("div");
    box.className = "hint-box";
    box.innerHTML = prepareMath(`<b>Подсказка ${hintIndex+1}.</b> ${pr.hints[hintIndex]}`);
    hintsWrap.appendChild(box);
    renderMath(box);
    restoreInputs(box);
    hintIndex++;
    if (hintIndex >= pr.hints.length) {
      hintBtn.disabled = true; hintBtn.textContent = "Все подсказки показаны";
    }
  });

  revealBtn.addEventListener("click", () => {
    reveal.classList.toggle("hidden");
    revealBtn.textContent = reveal.classList.contains("hidden")
      ? "🔎 Показать решение (заполни пропуски)"
      : "Скрыть решение";
    if (!reveal.classList.contains("hidden")) {
      renderMath(reveal);
      restoreInputs(reveal);
    }
  });

  card.querySelector(".check-blanks").addEventListener("click", () => {
    const blanks = reveal.querySelectorAll("input.blank");
    let okCount = 0;
    blanks.forEach(inp => {
      const ok = checkInput(inp);
      inp.classList.remove("shown");
      inp.classList.toggle("ok", ok);
      inp.classList.toggle("err", !ok && inp.value.trim() !== "");
      if (ok) okCount++;
    });
    blanksFb.textContent = `Верно: ${okCount} из ${blanks.length}`;
    blanksFb.className = "blanks-feedback " + (okCount === blanks.length ? "ok" : "err");
  });

  card.querySelector(".show-all").addEventListener("click", () => {
    reveal.querySelectorAll("input.blank").forEach(inp => {
      inp.value = String(inp.dataset.answer).replace(".", ",");
      inp.classList.remove("err", "ok");
      inp.classList.add("shown");
    });
    blanksFb.textContent = "Все пропуски заполнены.";
    blanksFb.className = "blanks-feedback ok";
  });
}

renderSectionTabs();
renderGroupTabs();
renderContent();
</script>
</body>
